[package]
name = "git-credential-github-keychain"
version = "0.3.0"
authors = ["Jake Wilkins <jakewilkins@github.com>"]
edition = "2021"
exclude = ["/script"]
license = "MIT"
description = "A Git Credential helper that supports GitHub App User-to-Server tokens"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
serde = "1.0.116"
serde_derive = "1.0.116"
serde_json = "1.0"
confy = "2.0.0"
chrono = "0.4"
github-device-flow = "0.3.0"


[target.'cfg(target_arch = "arm")'.dependencies]
openssl = { version = "0.10.41", features = ["vendored"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
openssl = { version = "0.10.41", features = ["vendored"] }
